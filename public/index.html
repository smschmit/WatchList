<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Watch List</title>
  <meta name="theme-color" content="#3a3f8f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="back-btn" class="back-btn" type="button" aria-label="Back" title="Back" hidden>‹</button>
    <button id="fwd-btn" class="back-btn" type="button" aria-label="Forward" title="Forward" hidden>›</button>
    <a class="brand" href="#/">Watch List <span id="app-version" class="version"></span></a>
    <form id="search-form" class="search" role="search">
      <input id="search" type="search" placeholder="Search" aria-label="Search all fields" autocomplete="off">
    </form>
    <span id="sync-status" class="sync-status" hidden></span>
    <nav class="nav">
      <a href="#/" data-nav="browse">Browse</a>
      <a href="#/list" data-nav="list">All</a>
      <a href="#/actors" data-nav="actors">Actors</a>
      <a href="#/recent" data-nav="recent">Recent</a>
      <a href="#/updates" data-nav="updates" class="edit-only">Updates</a>
      <a href="#/add" data-nav="add" class="edit-only">+ Add</a>
      <a href="#/account" data-nav="account" aria-label="Account and backup">☰</a>
    </nav>
  </header>
  <div id="viewer-banner" class="viewer-banner" hidden></div>
  <main id="main"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
