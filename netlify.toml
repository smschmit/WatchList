# Netlify settings. No build step: the public/ folder is the site, netlify/functions holds the
# TMDB proxy and the Google Sheet export. data/ (your list) is not published.
[build]
  publish = "public"
  command = "echo 'No build step'"

[build.environment]
  # The Supabase URL and publishable key are public by design (they're in public/config.js);
  # access is enforced by the database rules. Don't fail the deploy over them.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_KEY,OWNER_EMAIL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
