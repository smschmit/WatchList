# Netlify settings. No build step: the public/ folder is the site, netlify/functions holds the
# TMDB proxy and the Google Sheet export. data/ (your list) is not published.
[build]
  publish = "public"
  command = "echo 'No build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
